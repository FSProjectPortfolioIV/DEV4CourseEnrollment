name: Provision Student Repository

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  create-repo:
    if: contains(github.event.issue.labels.*.name, 'provision-repo')
    runs-on: ubuntu-latest
    env:
      ORG_NAME: "FSProjectPortfolioIV"
    steps:
      # ==================== GENERATE ORG BOT TOKEN ====================
      - name: Generate GitHub App Installation Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ env.ORG_NAME }}   # scope beyond this repo so the template is accessible
      # ================================================================

      - name: Checkout Enrollment Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Parse Configuration and Validate Course Code
        id: code_check
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          EXPECTED_HASH=$(grep "# COURSE_CODE:" dev4Info.txt | head -n1 | sed 's/# COURSE_CODE: //g' | tr -d '[:space:]')
          REPO_PREFIX=$(grep "# PREFIX:" dev4Info.txt | head -n1 | sed 's/# PREFIX: //g' | tr -d '[:space:]')
          TEMPLATE_NAME=$(grep "# TEMPLATE:" dev4Info.txt | head -n1 | sed 's/# TEMPLATE: //g' | tr -d '[:space:]')

          # Pull the course code out of the issue form field
          STUDENT_CODE=$(echo "$ISSUE_BODY" | sed -n '/### Course Code/{n;p;}' | tr -d '[:space:]')
          if [ -z "$STUDENT_CODE" ] || [ "$STUDENT_CODE" = "_No_response_" ]; then
            STUDENT_CODE=$(echo "$ISSUE_BODY" | sed -n '/### Course Code/{n;n;p;}' | tr -d '[:space:]')
          fi

          # Redact before anything can fail, so the code never lingers in the issue.
          # Bash string replacement, not sed: the code is untrusted input and would
          # otherwise be interpreted as a regex.
          if [ -n "$STUDENT_CODE" ]; then
            REDACTED_BODY=${ISSUE_BODY//"$STUDENT_CODE"/[used course code]}
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$REDACTED_BODY"
          fi

          if [ -z "$STUDENT_CODE" ]; then
            echo "AUTH_FAILED=true" >> $GITHUB_ENV
            echo "::error::No course code found in the issue body."
            exit 0
          fi

          # printf '%s' (not echo) -- echo would append a newline and change the digest
          STUDENT_HASH=$(printf '%s' "$STUDENT_CODE" | sha256sum | awk '{print $1}')

          if [ "$STUDENT_HASH" != "$EXPECTED_HASH" ]; then
            echo "AUTH_FAILED=true" >> $GITHUB_ENV
            echo "::error::Invalid course code submitted."
            exit 0
          fi

          echo "AUTH_FAILED=false" >> $GITHUB_ENV
          STUDENT_USER="${{ github.event.issue.user.login }}"
          echo "DYNAMIC_REPO_NAME=${REPO_PREFIX}${STUDENT_USER}" >> $GITHUB_ENV
          echo "DYNAMIC_TEMPLATE_NAME=$TEMPLATE_NAME" >> $GITHUB_ENV

      - name: Handle Invalid Course Code
        if: env.AUTH_FAILED == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --body "❌ **Repository Creation Failed:** The course code you entered is incorrect. Please verify the code from the course module and try opening a new issue."
          gh issue close $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --reason "not planned"
          exit 1

      - name: Check If Repository Already Exists
        if: env.AUTH_FAILED == 'false'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ORG: ${{ env.ORG_NAME }}
          NEW_REPO_NAME: ${{ env.DYNAMIC_REPO_NAME }}
        run: |
          if gh repo view "$ORG/$NEW_REPO_NAME" > /dev/null 2>&1; then
            echo "REPO_EXISTS=true" >> $GITHUB_ENV
            echo "::warning::Repository $ORG/$NEW_REPO_NAME already exists. Skipping creation."
          else
            echo "REPO_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Handle Duplicate Repository Request
        if: env.REPO_EXISTS == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ORG: ${{ env.ORG_NAME }}
          STUDENT: ${{ github.event.issue.user.login }}
          NEW_REPO_NAME: ${{ env.DYNAMIC_REPO_NAME }}
        run: |
          gh issue comment $ISSUE_NUMBER \
            --repo "$GITHUB_REPOSITORY" \
            --body "⚠️ @$STUDENT You already have an assignment repository for this course.

          Your private workspace: **https://github.com/${ORG}/${NEW_REPO_NAME}**

          This duplicate request has been closed automatically so your existing work is not overwritten."
          gh issue close $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --reason "completed"
          exit 0

      - name: Notify Student of Verification Success
        if: env.AUTH_FAILED == 'false' && env.REPO_EXISTS == 'false'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --body "✅ Verification passed. Creating your repository (be patient, this takes a few minutes)."

      - name: Generate Repository and Invite Student
        if: env.AUTH_FAILED == 'false' && env.REPO_EXISTS == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ORG: ${{ env.ORG_NAME }}
          TEMPLATE_REPO: ${{ env.DYNAMIC_TEMPLATE_NAME }}
          STUDENT: ${{ github.event.issue.user.login }}
          NEW_REPO_NAME: ${{ env.DYNAMIC_REPO_NAME }}
        run: |
          echo "Creating private repository $NEW_REPO_NAME from template $TEMPLATE_REPO..."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/$ORG/$TEMPLATE_REPO/generate \
            -f owner="$ORG" \
            -f name="$NEW_REPO_NAME" \
            -F private=true

          echo "Waiting for GitHub to finish generating files from the template..."
          for i in $(seq 1 15); do
            BRANCH_CHECK=$(gh api /repos/$ORG/$NEW_REPO_NAME/branches --jq '.[].name' 2>/dev/null || true)
            if [ -n "$BRANCH_CHECK" ]; then
              echo "Repository files and branches initialized successfully!"
              break
            fi
            echo "Template copy in progress... waiting 3 seconds (Attempt $i/15)"
            sleep 3
          done
          sleep 5

          echo "Adding student $STUDENT as a collaborator..."
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            /repos/$ORG/$NEW_REPO_NAME/collaborators/$STUDENT \
            -f permission='write'

          gh issue comment $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --body "@$STUDENT an invitation to collaborate on **https://github.com/${ORG}/${NEW_REPO_NAME}** has been sent. Please **check your email** to accept it."

      - name: Close Issue and Reply to Student
        if: env.AUTH_FAILED == 'false' && env.REPO_EXISTS == 'false'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ORG: ${{ env.ORG_NAME }}
          STUDENT: ${{ github.event.issue.user.login }}
          NEW_REPO_NAME: ${{ env.DYNAMIC_REPO_NAME }}
        run: |
          gh issue comment $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --body "@$STUDENT Private repository successfully configured at **https://github.com/${ORG}/${NEW_REPO_NAME}**"
          gh issue close $ISSUE_NUMBER --repo "$GITHUB_REPOSITORY" --reason "completed"
